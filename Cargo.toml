[package]
name = "rp2350_logic_analyzer"
version = "0.1.0"
authors = ["Thomas Q <thomasqsa@gmail.com>"]
edition = "2024"

[[bin]]
name = "rp2350_logic_analyzer"
test = false
bench = false

[features]
default = ["rp235xa"]
rp235xa = ["embassy-rp/rp235xa", "rp-pac/rp235x"]
rp235xb = ["embassy-rp/rp235xb", "rp-pac/rp235x"]

[dependencies]
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread", "defmt"] }
embassy-futures = { version = "0.1.2", features = ["defmt"] }
embassy-rp = { version = "0.10.0", features = ["time-driver", "critical-section-impl", "defmt", "binary-info"] }
embassy-sync = { version = "0.8.0", features = ["defmt"] }
embassy-time = { version = "0.5.1", features = ["defmt", "defmt-timestamp-uptime"] }
embassy-usb = { version = "0.6.0", default-features = false, features = ["defmt", "max-interface-count-5"] }

cortex-m = { version = "0.7.9", features = ["inline-asm"] }
cortex-m-rt = "0.7.7"

defmt = "1.2.0"
defmt-rtt = "1.3.1"
heapless = "0.9.3"
portable-atomic = { version = "1.5", features = ["critical-section"] }
rp-pac = { version = "7.0.0", features = ["cortex-m-rt", "defmt"] }
static_cell = "2.1.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = 2

[profile.dev]
opt-level = "s"
debug = 2
